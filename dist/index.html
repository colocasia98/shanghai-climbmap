  <style>
    :root { color-scheme:light dark; --background:light-dark(#fff,#181a1d); --foreground:light-dark(#202327,#e7e9ec); --muted:light-dark(#f1f3f5,#292c31); --secondary:light-dark(#626970,#abb2bc); --border:light-dark(#d6dbe0,#454b54); --font-size-base:14px; --known:#ffda28; --added:#2573b9; --late:light-dark(#238b57,#53bd85); --yellow:#ffda28; --old:#080808; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--background); color:var(--foreground); font-family:system-ui,-apple-system,"PingFang SC",sans-serif; font-size:var(--font-size-base); }
    main { width:min(1120px,100%); margin:auto; padding:18px; }
    header { display:flex; flex-wrap:wrap; justify-content:space-between; gap:12px; align-items:baseline; margin-bottom:12px; }
    h1 { margin:0; font-size:1.25rem; font-weight:500; }
    .secondary { color:var(--secondary); }
    .small { font-size:.85rem; }
    .toolbar { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:12px; margin-bottom:10px; }
    .legend { display:flex; flex-wrap:wrap; gap:12px; }
    .legend span { display:inline-flex; align-items:center; gap:5px; }
    .dot { width:10px; height:10px; border-radius:50%; display:inline-block; }
    .dot.known { background:var(--known); border:1px solid #6a5500; }
    .dot.added { background:var(--added); border-radius:0; transform:rotate(45deg); width:8px; height:8px; margin:1px; }
    .dot.late { background:var(--late); }
    .hours-line { display:flex; flex-wrap:wrap; gap:8px; align-items:baseline; }
    .hours-line.is-late { color:var(--late); }
    .dot.yellow { background:var(--yellow); border:1px solid #6a5500; }
    .triangle { width:12px; height:11px; background:#89929a; clip-path:polygon(50% 0,100% 100%,0 100%); border:1px solid var(--border); }
    .controls { display:flex; flex-wrap:wrap; gap:6px; }
    button,a.button,select { color:var(--foreground); background:var(--background); border:1px solid var(--border); border-radius:5px; font:inherit; padding:7px 10px; }
    button,a.button { cursor:pointer; text-decoration:none; }
    button:hover,a.button:hover { background:var(--muted); }
    button:focus-visible,a:focus-visible,select:focus-visible { outline:2px solid var(--added); outline-offset:2px; }
    #map { width:100%; height:540px; background:#edf0ee; }
    .leaflet-container { font-family:inherit; }
    .quiet-roads { filter:saturate(.12); }
    .leaflet-control-attribution { color:#555; background:rgba(255,255,255,.9); }
    .leaflet-control-attribution a { color:#315c80; }
    #map-status { margin-top:6px; min-height:1.2em; }
    .picker { display:grid; grid-template-columns:auto minmax(0,1fr); align-items:center; gap:10px; margin:14px 0 10px; }
    select { width:100%; min-width:0; }
    .detail { padding:12px 0; border-top:1px solid var(--border); border-bottom:1px solid var(--border); display:grid; gap:8px; }
    .detail[hidden] { display:none; }
    .detail-head { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:10px; }
    #name { font-weight:500; }
    details { margin-top:14px; }
    summary { cursor:pointer; }
    .index { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:4px 12px; margin-top:8px; }
    .index button { border:0; border-radius:0; background:transparent; text-align:left; padding:6px 0; white-space:normal; }
    .index button:hover { color:var(--added); }
    footer { margin-top:18px; }
    .venue-overlay { position:absolute; left:0; top:0; pointer-events:none; overflow:visible; }
    .venue-label { fill:#1e252b; stroke:#fff; stroke-width:4; paint-order:stroke; stroke-linejoin:round; font-size:12px; font-weight:500; }
    .error { color:light-dark(#a33224,#ffab9f); }
    @media(max-width:700px) { main { padding:12px; } #map { height:470px; } .index { grid-template-columns:repeat(2,minmax(0,1fr)); } }
    @media(max-width:430px) { #map { height:430px; } .index { grid-template-columns:1fr; } .picker { grid-template-columns:1fr; gap:6px; } select { font-size:16px; } }
  </style>

<body>
<main id="shanghai-amap">
  <header>
    <h1>上海商业岩馆地图</h1>
    <span class="small secondary">简洁路网 · 无商家标注</span>
  </header>
  <div class="toolbar">
    <div class="legend small" aria-label="标点图例">
      <span><i class="dot known" aria-hidden="true"></i>你的清单</span>
      <span><i class="dot added" aria-hidden="true"></i>补充</span>
      <span><i class="triangle" aria-hidden="true"></i>待核</span>
      <span><i class="dot late" aria-hidden="true"></i>工作日≥23:00</span>
    </div>
    <div class="controls">
      <button id="central" type="button">中心城区</button>
      <button id="all" type="button">全上海</button>
    </div>

<script>
(() => {
  'use strict';
  const data=JSON.parse(document.getElementById('venue-data').textContent);
  const venues=data.venues;
  const byId=new Map(venues.map(v=>[v.id,v]));
  const hasPoint=v=>Number.isFinite(v.lng)&&Number.isFinite(v.lat);
  const pending=v=>v.status==='待核';
  const inactive=pending;
  const active=venues.filter(v=>!inactive(v));
  const mapped=venues.filter(hasPoint);
  const $=id=>document.getElementById(id);
  const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const groups=[
    {key:'known',name:'你的清单',items:venues.filter(v=>v.known&&!inactive(v))},
    {key:'added',name:'补充场馆',items:venues.filter(v=>!v.known&&!inactive(v))},
    {key:'pending',name:'待核',items:venues.filter(inactive)}
  ];
  $('venue-select').innerHTML='<option value="" disabled selected>请选择</option>'+groups.map(g=>`<optgroup label="${g.name}">${g.items.map(v=>`<option value="${v.id}">${escape(v.name)} · ${escape(v.district)}</option>`).join('')}</optgroup>`).join('');
  groups.forEach(g=>{
    $(g.key+'-title').textContent=`${g.name} · ${g.items.length}家`;
    $(g.key+'-index').innerHTML=g.items.map(v=>`<button type="button" data-venue="${v.id}">${escape(v.name)}</button>`).join('');
  });
  // GeoQ roads in China align with GCJ-02 coordinates projected onto Web Mercator.
  const map=L.map('map',{zoomSnap:.25,minZoom:9,maxZoom:18,attributionControl:true}).setView([31.215,121.465],11.5);
  map.attributionControl.setPrefix(false);
  const tiles=L.tileLayer('https://thematic.geoq.cn/arcgis/rest/services/ChinaOnlineStreetGray/MapServer/tile/{z}/{y}/{x}',{
    minZoom:9,maxZoom:18,crossOrigin:false,
    attribution:'底图 © <a href="https://web.geoq.cn/" target="_blank" rel="noopener noreferrer">GeoQ</a> · 易图通'
  }).addTo(map);
  let loadedTiles=0,failedTiles=0;
  function updateStatus(){
    const n=active.filter(v=>hasPoint(v)&&map.getBounds().contains([v.lat,v.lng])).length;
    $('map-status').textContent=`视野内${n}家正常收录场馆 · ${loadedTiles?'底图已加载':'正在加载底图…'}`;
    $('map-status').classList.remove('error');
    if(failedTiles&&!loadedTiles){$('map-status').textContent='底图暂未加载，请检查网络后刷新；场馆地址和导航仍可使用。';$('map-status').classList.add('error');}
  }
  tiles.on('tileload',()=>{loadedTiles++;updateStatus();});
  tiles.on('tileerror',()=>{failedTiles++;updateStatus();});
  const pane=map.createPane('venue-overlay');pane.style.zIndex='450';pane.style.pointerEvents='none';
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('class','venue-overlay');svg.setAttribute('aria-hidden','true');pane.appendChild(svg);
  let selected=null;
  const late=v=>!inactive(v)&&v.lateWeekdays===true;
  const markerStyle=v=>inactive(v)?{fill:'#89929a',shape:'triangle',stroke:'#fff',radius:5}:{fill:late(v)?'var(--late)':v.known?'#ffda28':'#2573b9',shape:v.known?'circle':'diamond',stroke:late(v)?'#fff':v.known?'#6a5500':'#fff',radius:5};
  function projection(){
    const size=map.getSize(),c=map.getCenter();
    return d3.geoMercator().center([c.lng,c.lat]).scale(256*Math.pow(2,map.getZoom())/(2*Math.PI)).translate([size.x/2,size.y/2]);
  }
  function paintedBounds(element){
    const {x,y,width,height}=element.getBBox();
    const style=getComputedStyle(element);
    const halfStroke=parseFloat(style.strokeWidth)/2;
    const padding=element.localName==='path'&&style.strokeLinejoin==='miter'
      ?halfStroke*Number(style.strokeMiterlimit):halfStroke;
    return {left:x-padding,top:y-padding,right:x+width+padding,bottom:y+height+padding};
  }
  const clamp=(value,min,max)=>Math.min(max,Math.max(min,value));
  const overlaps=(a,b)=>a.left<b.right+1&&a.right+1>b.left&&a.top<b.bottom+1&&a.bottom+1>b.top;
  function render(){
    const size=map.getSize(),project=projection();
    const topLeft=map.containerPointToLayerPoint([0,0]);
    L.DomUtil.setPosition(svg,topLeft);svg.setAttribute('width',size.x);svg.setAttribute('height',size.y);svg.setAttribute('viewBox',`0 0 ${size.x} ${size.y}`);
    const projected=mapped.map(v=>({v,p:project([v.lng,v.lat])}));
    const visible=projected.filter(x=>x.p[0]>-20&&x.p[0]<size.x+20&&x.p[1]>-20&&x.p[1]<size.y+20);
    // Keep markers available beyond the viewport as Leaflet moves the pane during a drag.
    const ordered=[...projected.filter(x=>x.v.id!==selected),...projected.filter(x=>x.v.id===selected)];
    let markerHtml='';
    for(const {v,p:[x,y]} of ordered){
      const m=markerStyle(v),r=m.radius+(v.id===selected?2:0);
      if(v.id===selected)markerHtml+=`<circle cx="${x}" cy="${y}" r="${r+7}" fill="${m.fill}" fill-opacity=".2"/>`;
      const a=`data-venue="${v.id}" data-marker-type="${m.shape}" fill="${m.fill}" stroke="${m.stroke}" stroke-width="${v.known?1.8:1.5}"`;
      if(m.shape==='triangle')markerHtml+=`<path ${a} d="M${x} ${y-r-2}L${x+r+1} ${y+r}L${x-r-1} ${y+r}Z"/>`;
      else if(m.shape==='diamond')markerHtml+=`<path ${a} d="M${x} ${y-r-1}L${x+r+1} ${y}L${x} ${y+r+1}L${x-r-1} ${y}Z"/>`;
      else markerHtml+=`<circle ${a} cx="${x}" cy="${y}" r="${r}"/>`;
    }
    const labelPoints=[...visible.filter(x=>x.v.id===selected),...(map.getZoom()>13?visible.filter(x=>x.v.id!==selected):[])];
    const labelHtml=labelPoints.map(({v})=>`<text class="venue-label" data-venue-label="${v.id}">${escape(v.name)}</text>`).join('');
    svg.innerHTML=`<g class="venue-labels">${labelHtml}</g><g class="venue-markers">${markerHtml}</g>`;
    const occupied=Array.from(svg.querySelectorAll('[data-marker-type]'),paintedBounds);
    const labels=Array.from(svg.querySelectorAll('.venue-label'));
    // Measure both anchors at the origin so each candidate can reuse the bounds.
    const startBounds=labels.map(paintedBounds);
    labels.forEach(label=>label.setAttribute('text-anchor','end'));
    const endBounds=labels.map(paintedBounds);
    labels.forEach((label,index)=>{
      const {v,p:[x,y]}=labelPoints[index];
      const isSelected=v.id===selected;
      const candidates=[
        [x+12,y-10,'start'],[x-12,y-10,'end'],
        [x+12,y+22,'start'],[x-12,y+22,'end']
      ];
      if(isSelected){
        const bounds=startBounds[index],marker=occupied.at(-1);
        const centerX=clamp(x-(bounds.left+bounds.right)/2,5-bounds.left,size.x-5-bounds.right);
        const centerY=y-(bounds.top+bounds.bottom)/2;
        candidates.push(
          [centerX,marker.top-3-bounds.bottom,'start'],
          [centerX,marker.bottom+3-bounds.top,'start'],
          [marker.right+3-bounds.left,centerY,'start'],
          [marker.left-3-bounds.right,centerY,'start']
        );
        // If the nearby positions are blocked, try the closest free row in this column.
        const rows=occupied
          .filter(b=>b.left<centerX+bounds.right+1&&b.right+1>centerX+bounds.left)
          .flatMap(b=>[b.top-2-bounds.bottom,b.bottom+2-bounds.top])
          .sort((a,b)=>Math.abs(a-centerY)-Math.abs(b-centerY));
        candidates.push(...rows.map(row=>[centerX,row,'start']));
      }
      let placement,fewestOverlaps=Infinity;
      for(let [tx,ty,anchor] of candidates){
        const bounds=(anchor==='end'?endBounds:startBounds)[index];
        if(isSelected){
          tx=clamp(tx,5-bounds.left,size.x-5-bounds.right);
          ty=clamp(ty,5-bounds.top,size.y-5-bounds.bottom);
        }
        const rect={left:tx+bounds.left,top:ty+bounds.top,right:tx+bounds.right,bottom:ty+bounds.bottom};
        if(rect.left<5||rect.right>size.x-5||rect.top<5||rect.bottom>size.y-5)continue;
        const collisions=occupied.filter(b=>overlaps(rect,b)).length;
        if(collisions===0||(isSelected&&collisions<fewestOverlaps)){
          placement={tx,ty,anchor,rect};
          fewestOverlaps=collisions;
        }
        if(collisions===0)break;
      }
      if(!placement){
        label.remove();
        return;
      }
      label.setAttribute('x',placement.tx);
      label.setAttribute('y',placement.ty);
      label.setAttribute('text-anchor',placement.anchor);
      occupied.push(placement.rect);
    });
    updateStatus();
  }
  function choose(id,pan=true){
    const v=byId.get(Number(id));if(!v)return;selected=v.id;
    $('venue-select').value=String(v.id);$('name').textContent=v.name;$('address').textContent=v.address;
    $('hours').textContent=v.weekdayHours?`${v.hoursStatus==='historical'?'旧资料工作日':'工作日'}：${v.weekdayHours}${v.hoursStatus==='historical'?'（现行时间待核）':''}`:'工作日营业时间待核';
    $('hours-line').classList.toggle('is-late',late(v));
    $('hours-source').textContent=v.hoursStatus==='api'?'高德门店时间':'时间来源';
    $('hours-source').hidden=!v.hoursSource;
    if(v.hoursSource)$('hours-source').href=v.hoursSource;
    $('meta').textContent=`${v.district} · ${pending(v)?'待核':v.known?'你的清单':'补充'} · ${v.quality}`;
    $('note').textContent=v.note;$('note').hidden=!v.note;$('navigation').href=v.navigation;
    $('venue-detail').hidden=false;
    if(pan&&hasPoint(v))map.setView([v.lat,v.lng],Math.max(map.getZoom(),14),{animate:false});
    render();
  }
  map.on('moveend zoom resize',render);
  map.on('click',event=>{
    const project=projection();
    let nearest=null,dist=24;
    for(const v of mapped){
      const [x,y]=project([v.lng,v.lat]);
      const d=Math.hypot(event.containerPoint.x-x,event.containerPoint.y-y);
      if(d<dist){dist=d;nearest=v;}
    }
    if(nearest)choose(nearest.id,false);
  });
  $('venue-select').addEventListener('change',e=>choose(e.target.value));
  $('shanghai-amap').addEventListener('click',e=>{const b=e.target.closest('button[data-venue]');if(b)choose(b.dataset.venue);});
  $('central').addEventListener('click',()=>map.fitBounds([[31.085,121.25],[31.335,121.66]],{padding:[12,12],animate:false}));
  $('all').addEventListener('click',()=>map.fitBounds(active.filter(hasPoint).map(v=>[v.lat,v.lng]),{padding:[22,22],animate:false}));
  new ResizeObserver(()=>map.invalidateSize({animate:false})).observe($('map'));
  map.fitBounds([[31.085,121.25],[31.335,121.66]],{padding:[12,12],animate:false});
  render();
  // Read-only QA surface: provider, loaded image count and projected/Leaflet pixel differences.
  window.shanghaiClimbingMapState=()=>({provider:'GeoQ',coordinateSystem:data.displayCoordinateSystem,loadedTiles,failedTiles,selected,
    pendingVenues:venues.filter(pending).map(v=>v.id),
    projectionResiduals:mapped.map(v=>{const a=projection()([v.lng,v.lat]),b=map.latLngToContainerPoint([v.lat,v.lng]);return Math.hypot(a[0]-b.x,a[1]-b.y);})});
})();
</script>
